<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Uzay Görevi: Olasılık Macerası</title>
<style>
:root{
  --bg:#060a18;--panel:rgba(16,24,50,.82);--panel2:rgba(28,39,76,.9);--line:rgba(150,170,255,.18);
  --text:#eef1ff;--muted:#a9b3da;--ok:#3ddc97;--bad:#ff5d6c;--warn:#ffc857;--accent:#7aa2ff;
  --mars:#e2683c;--shield:#5ec8ff;--part:#ffb454;--star:#ffd166;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);
  font-family:system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-tap-highlight-color:transparent}
body{overflow-x:hidden;line-height:1.45}
#stars{position:fixed;inset:0;z-index:0;width:100%;height:100%}
#app{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:14px 16px 48px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
button:disabled{cursor:not-allowed}
h1,h2,h3{margin:0;line-height:1.2}
p{margin:.4em 0}
.btn{background:linear-gradient(180deg,#9bbcff,#6d93f5);color:#0a1230;font-weight:800;padding:14px 26px;border-radius:14px;font-size:1.08rem;
  min-height:52px;box-shadow:0 6px 24px rgba(122,162,255,.35),inset 0 1px 0 rgba(255,255,255,.5);transition:transform .1s,filter .2s,box-shadow .2s}
.btn:hover{filter:brightness(1.08);box-shadow:0 8px 32px rgba(122,162,255,.55),inset 0 1px 0 rgba(255,255,255,.5)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:rgba(255,255,255,.04);color:var(--text);border:1.5px solid var(--line);box-shadow:none}
.btn.big{font-size:1.3rem;padding:18px 42px;border-radius:18px}
.btn.okb{background:linear-gradient(180deg,#6ff0b6,#2fc283);box-shadow:0 6px 24px rgba(61,220,151,.35)}
.btn.warnb{background:linear-gradient(180deg,#ffe08a,#f5b83d);box-shadow:0 6px 24px rgba(255,200,87,.35)}
.btn.pulse{animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 6px 24px rgba(122,162,255,.35)}50%{box-shadow:0 6px 44px rgba(122,162,255,.8),0 0 0 8px rgba(122,162,255,.12)}}
.screen{display:none}
.screen.on{display:block;animation:fade .45s ease}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.5)}70%{transform:scale(1.12)}100%{opacity:1;transform:none}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:22px;backdrop-filter:blur(8px);
  box-shadow:0 10px 40px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.05)}
.muted{color:var(--muted)}
.small{font-size:.9rem}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.center{text-align:center}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:.82rem;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap}
.tag.sh{background:rgba(94,200,255,.15);color:var(--shield);border:1px solid rgba(94,200,255,.4)}
.tag.pt{background:rgba(255,180,84,.15);color:var(--part);border:1px solid rgba(255,180,84,.4)}
.shake{animation:shakeA .6s}
@keyframes shakeA{10%,50%,90%{transform:translateX(-7px)}30%,70%{transform:translateX(7px)}}

/* ---------- INTRO ---------- */
.intro{text-align:center;padding-top:1vh}
.host3d{position:relative;width:100%;overflow:hidden;background:#000}
.host3d canvas{display:block;width:100%;height:100%}
.w3flash{position:absolute;inset:0;background:#fff4e6;opacity:0;pointer-events:none}
.w3warp{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:6% 16px 7%;opacity:0;pointer-events:none;text-align:center}
.w3warp .k{font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#9fc0ff;font-size:clamp(.8rem,2vw,1.05rem);text-shadow:0 0 12px rgba(120,160,255,.8)}
.w3warp .t{font-weight:900;color:#fff;font-size:clamp(1.6rem,5vw,3rem);text-shadow:0 0 24px rgba(120,160,255,.9),0 2px 8px rgba(0,0,0,.8)}
#introHost{height:clamp(200px,36vh,380px);border-radius:26px;margin-bottom:6px;background:transparent;
  -webkit-mask-image:radial-gradient(ellipse 52% 54% at 50% 50%,#000 62%,transparent 100%);mask-image:radial-gradient(ellipse 52% 54% at 50% 50%,#000 62%,transparent 100%)}
.credit{font-size:.75rem;color:var(--muted);opacity:.75;margin-top:10px}
.introlang{display:flex;justify-content:flex-end;margin-bottom:6px}
.langsw{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--panel)}
.langsw button{padding:9px 14px;font-weight:700;font-size:.9rem;color:var(--muted);min-height:44px}
.langsw button.sel{background:var(--accent);color:#0a1230}
.intro h1{font-size:clamp(2rem,5.6vw,3.6rem);letter-spacing:-.5px;background:linear-gradient(90deg,#9fd0ff,#ffffff 45%,#ffb48a);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 24px rgba(159,208,255,.35))}
.intro .sub{font-size:clamp(1.05rem,2.4vw,1.3rem);color:var(--muted);max-width:660px;margin:10px auto 22px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:840px;margin:0 auto 22px;text-align:left}
.step{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px;animation:rise .6s both}
.step:nth-child(2){animation-delay:.1s}.step:nth-child(3){animation-delay:.2s}
.step b{display:block;font-size:1.05rem;margin-bottom:3px}
.modes{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:6px auto 22px}
.mode{border:2px solid var(--line);background:var(--panel);border-radius:16px;padding:12px 18px;min-width:250px;text-align:left;transition:border-color .2s,background .2s}
.mode b{display:block;font-size:1.05rem}
.mode.sel{border-color:var(--accent);background:rgba(122,162,255,.16);box-shadow:0 0 24px rgba(122,162,255,.25)}
.standstats{margin-top:22px;font-size:.95rem;color:var(--muted)}
.standstats b{color:var(--text)}
.linkbtn{color:var(--muted);text-decoration:underline;font-size:.82rem;padding:6px}

/* ---------- HUD ---------- */
.hud{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.hud .title{font-weight:800;font-size:1rem;color:var(--muted)}
.res{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:700;font-size:.98rem}
.chip .pips{display:inline-flex;gap:3px}
.chip .pip{width:11px;height:11px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor}
.chip .pip.off{background:transparent;border:1.5px solid currentColor;opacity:.45;box-shadow:none}
.chip.sh{color:var(--shield)} .chip.pt{color:var(--part)} .chip.sc{color:var(--star)}
.iconbtn{width:48px;height:48px;border-radius:50%;background:var(--panel);border:1px solid var(--line);font-size:1.1rem}
.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.22)}}

.track{position:relative;height:60px;margin:2px 6px 10px}
.track .line{position:absolute;left:28px;right:28px;top:29px;height:3px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.28) 0 8px,transparent 8px 14px)}
.track .fill{position:absolute;left:28px;top:29px;height:3px;background:linear-gradient(90deg,#7aa2ff,#ffb48a);transition:width .8s ease;box-shadow:0 0 10px rgba(122,162,255,.8)}
.node{position:absolute;top:30px;transform:translate(-50%,-50%);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:.95rem;
  background:var(--panel2);border:2px solid var(--line);transition:border-color .3s,box-shadow .3s}
.node.done{border-color:var(--ok);box-shadow:0 0 12px rgba(61,220,151,.5)} .node.fail{border-color:var(--bad);box-shadow:0 0 12px rgba(255,93,108,.6)}
.node.cur{border-color:var(--accent);box-shadow:0 0 0 5px rgba(122,162,255,.2),0 0 16px rgba(122,162,255,.6)}
.node.hypo{border-style:dashed;border-color:var(--warn)}
.node.endp{width:44px;height:44px;border:0}
.node.e{background:radial-gradient(circle at 35% 30%,#9fe0ff,#2a7fd4 50%,#123d7a);box-shadow:0 0 16px rgba(80,160,255,.5)}
.node.m{background:radial-gradient(circle at 35% 30%,#ffb48a,#e2683c 50%,#7d2a12);box-shadow:0 0 16px rgba(226,104,60,.5)}
.node .lbl{position:absolute;top:30px;font-size:.7rem;color:var(--muted);white-space:nowrap}
.ship{position:absolute;top:0;font-size:26px;transform:translateX(-50%) rotate(45deg);transition:left .9s cubic-bezier(.5,.1,.3,1);filter:drop-shadow(0 0 8px rgba(255,200,120,.7));z-index:2}
.ship.boom{filter:grayscale(1) brightness(.6)}

/* ---------- STAGE ---------- */
.scenewrap{position:relative;border-radius:24px;overflow:hidden;border:1px solid var(--line);box-shadow:0 14px 50px rgba(0,0,0,.45);background:#050816}
#sceneHost{height:clamp(220px,40vh,420px)}
.scenehead{position:absolute;left:0;right:0;top:0;padding:14px 18px 40px;background:linear-gradient(180deg,rgba(3,6,18,.75),rgba(3,6,18,0));pointer-events:none;transition:opacity .3s}
.scenehead.hide{opacity:0}
.kicker{font-size:.82rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#9fc0ff;text-shadow:0 1px 6px rgba(0,0,0,.7)}
.scenehead h2{font-size:clamp(1.4rem,3.4vw,2.1rem);margin-top:2px;text-shadow:0 2px 14px rgba(0,0,0,.8)}
.hypobadge{position:absolute;right:14px;top:14px;background:rgba(255,200,87,.92);color:#2a1d00;font-weight:800;font-size:.8rem;padding:5px 10px;border-radius:999px}
.scenetext{font-size:1.08rem;color:#d7dcf5;margin:12px 4px 12px;animation:fade .5s both}
.condnote{margin:0 0 12px;padding:12px 16px;border-radius:14px;background:rgba(94,200,255,.1);border:1px solid rgba(94,200,255,.35);color:#cdeeff;animation:fade .5s both}
.hyponote{margin:0 0 12px;padding:12px 16px;border-radius:14px;background:rgba(255,200,87,.1);border:1px solid rgba(255,200,87,.35);color:#ffe7b0}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.opt{position:relative;text-align:left;background:linear-gradient(160deg,rgba(30,42,84,.9),rgba(14,20,44,.9));border:2px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:10px;
  transition:transform .15s,border-color .2s,box-shadow .2s;animation:rise .5s both;overflow:hidden}
.opt:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at var(--mx,50%) var(--my,0%),rgba(122,162,255,.18),transparent 60%);opacity:0;transition:opacity .3s;pointer-events:none}
.opt:hover:not(:disabled){border-color:var(--accent);transform:translateY(-3px);box-shadow:0 12px 30px rgba(122,162,255,.25)}
.opt:hover:not(:disabled):before{opacity:1}
.opt:active:not(:disabled){transform:scale(.98)}
.opt:disabled{opacity:.42}
.opt .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.opt .lab{font-size:1.18rem;font-weight:800}
.opt .desc{color:var(--muted);font-size:.97rem;flex:1}
.pbar{height:16px;border-radius:999px;background:rgba(255,93,108,.3);overflow:hidden;position:relative}
.pbar i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;animation:grow 1s cubic-bezier(.3,.8,.3,1) both;transform-origin:left}
.pbar i:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);animation:shine 2.4s infinite;transform:translateX(-100%)}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes shine{60%,100%{transform:translateX(100%)}}
.stats{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.stats .pp{font-size:1.5rem;font-weight:900}
.stats .pp s{font-size:1rem;color:var(--muted);font-weight:600;margin-right:6px}
.stats .pts{font-weight:800;color:var(--star)}
.hint{font-size:.88rem;color:var(--muted)}
.hint b{color:var(--text)}
.nores{font-size:.85rem;color:var(--bad);font-weight:700}

/* ---------- ROLL ---------- */
.rollpanel{text-align:center;animation:rise .4s both}
.rollpanel h3{font-size:1.6rem;margin-top:4px}
.rollbar{position:relative;height:46px;border-radius:14px;margin:50px 4px 10px;background:linear-gradient(90deg,rgba(255,93,108,.55),rgba(255,93,108,.75))}
.rollbar .g{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#2fc283,#6ff0b6);border-radius:14px 0 0 14px;box-shadow:0 0 20px rgba(61,220,151,.4)}
.rollbar .lbl{position:absolute;top:50%;transform:translateY(-50%);font-weight:800;font-size:.9rem;color:#05121a}
.marker{position:absolute;top:-44px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;z-index:2}
.marker .num{background:#fff;color:#0a1230;font-weight:900;font-size:1.3rem;border-radius:10px;padding:2px 10px;min-width:50px;box-shadow:0 0 18px rgba(255,255,255,.6)}
.marker .stick{width:4px;height:88px;background:#fff;border-radius:2px;box-shadow:0 0 12px #fff}
.marker.land .num{animation:pop .45s}
.scale{display:flex;justify-content:space-between;gap:8px;font-size:.8rem;color:var(--muted);margin:18px 4px 0}
.verdict{font-size:2.2rem;font-weight:900;margin:12px 0 4px;min-height:1.2em}
.verdict.ok{color:var(--ok);text-shadow:0 0 24px rgba(61,220,151,.6);animation:pop .5s}
.verdict.bad{color:var(--bad);text-shadow:0 0 24px rgba(255,93,108,.6);animation:pop .5s}
.why{color:#e3e7fb;min-height:1.4em;font-size:1.08rem}
.explain{font-size:.95rem;color:var(--muted);margin-top:6px}
.rollpanel .actions{margin-top:18px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;min-height:52px}
.rollpanel .actions .btn{animation:rise .4s both}

/* ---------- END ---------- */
.hero{text-align:center;padding:0 0 26px;overflow:hidden}
#endHost{height:clamp(220px,40vh,420px);border-radius:22px 22px 0 0}
.hero .inner{padding:0 20px}
.hero h1{font-size:clamp(1.8rem,4.6vw,2.8rem);margin:16px 0 6px}
.bigp{font-size:clamp(2.8rem,9vw,4.6rem);font-weight:900;line-height:1;margin:10px 0 4px;background:linear-gradient(90deg,#9fd0ff,#fff);-webkit-background-clip:text;background-clip:text;color:transparent;
  font-variant-numeric:tabular-nums;filter:drop-shadow(0 0 20px rgba(159,208,255,.4))}
.luck{display:inline-block;margin-top:10px;padding:8px 14px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid var(--line)}
.sec{margin-top:16px;animation:rise .6s both}
.sec h2{font-size:1.35rem;margin-bottom:10px;display:flex;gap:10px;align-items:center}
.sec h2 .n{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--accent);color:#0a1230;font-size:1rem;flex:none;box-shadow:0 0 14px rgba(122,162,255,.6)}
.lead{font-size:1.04rem;color:#d7dcf5}
.formula{font-family:ui-monospace,Consolas,"Cascadia Mono",monospace;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:10px 0;overflow-x:auto;white-space:nowrap;font-size:.95rem}
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:12px 0;font-size:1.25rem;font-weight:900}
.chain>*{animation:pop .45s both}
.chain .c{padding:8px 12px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);text-align:center;line-height:1.1}
.chain .c small{display:block;font-size:.7rem;color:var(--muted);font-weight:600;margin-top:3px}
.chain .c.hypo{border-style:dashed;border-color:rgba(255,200,87,.6)}
.chain .c.res{background:rgba(122,162,255,.22);border-color:var(--accent);box-shadow:0 0 20px rgba(122,162,255,.4)}
.chain .op{color:var(--muted)}
.cum{display:grid;gap:7px;margin-top:10px}
.cum .r{display:grid;grid-template-columns:150px 1fr 64px;gap:10px;align-items:center;font-size:.95rem}
.cum .bar{height:20px;border-radius:8px;background:rgba(255,255,255,.06);overflow:hidden}
.cum .bar i{display:block;height:100%;background:linear-gradient(90deg,#7aa2ff,#9fd0ff);border-radius:8px;transition:width 1.2s cubic-bezier(.3,.8,.3,1);box-shadow:0 0 12px rgba(122,162,255,.5)}
.cum .v{text-align:right;font-weight:800}
table{width:100%;border-collapse:collapse;font-size:.95rem}
th,td{padding:8px 8px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:700;font-size:.85rem}
td.num,th.num{text-align:right;white-space:nowrap}
tr.mine td{background:rgba(122,162,255,.13)}
tr.stg td{background:rgba(255,255,255,.035);font-weight:800;padding-top:12px}
.tablewrap{overflow-x:auto;margin:0 -4px}
.best{color:var(--star);font-weight:800}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:12px}
.plan{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.plan b{display:block;font-size:1.5rem}
.plan.me{border-color:var(--accent);box-shadow:0 0 18px rgba(122,162,255,.25)}
.callout{margin-top:12px;padding:12px 16px;border-radius:14px;background:rgba(255,209,102,.08);border:1px solid rgba(255,209,102,.3)}
.simtop{display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.counters{display:flex;gap:10px;flex-wrap:wrap}
.counter{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:8px 14px;min-width:120px}
.counter small{display:block;color:var(--muted);font-size:.78rem}
.counter b{font-size:1.4rem;font-variant-numeric:tabular-nums}
.chartwrap{position:relative;margin-top:12px;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:16px;padding:8px}
canvas#chart{width:100%;height:300px;display:block}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.85rem;color:var(--muted);margin:8px 4px 0}
.legend i{display:inline-block;width:18px;height:3px;vertical-align:middle;margin-right:6px;border-radius:2px}
.fails{display:grid;gap:6px;margin-top:12px}
.fails .r{display:grid;grid-template-columns:150px 1fr 90px;gap:10px;align-items:center;font-size:.92rem}
.fails .bar{position:relative;height:18px;border-radius:6px;background:rgba(255,255,255,.06)}
.fails .bar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#ff5d6c,#ff8a7a);border-radius:6px;opacity:.85;transition:width .8s}
.fails .bar u{position:absolute;top:-3px;bottom:-3px;width:3px;background:#fff;border-radius:2px}
.endactions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:22px}
.modeswitch{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.modeswitch button{padding:8px 14px;font-weight:700;font-size:.9rem;color:var(--muted)}
.modeswitch button.sel{background:var(--accent);color:#0a1230}
.confetti{position:fixed;top:-20px;width:10px;height:14px;z-index:20;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

@media (max-width:760px){
  .steps{grid-template-columns:1fr}
  .cum .r{grid-template-columns:100px 1fr 58px}
  .fails .r{grid-template-columns:100px 1fr 74px}
  .node .lbl{display:none}
  .mode{min-width:0;width:100%}
  canvas#chart{height:240px}
  .panel{padding:16px}
  .hero{padding:0 0 18px}
  .scenehead{padding:10px 14px 30px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
<!--@@VENDOR@@-->
</head>
<body>
<canvas id="stars" aria-hidden="true"></canvas>
<div id="app">

  <!-- ================= INTRO ================= -->
  <section id="intro" class="screen on">
    <div class="intro">
      <div class="introlang" id="introLang"></div>
      <div id="introHost" class="host3d" aria-hidden="true"></div>
      <h1 data-t="title"></h1>
      <p class="sub" data-t="sub"></p>
      <div class="steps">
        <div class="step" data-t="s1"></div>
        <div class="step" data-t="s2"></div>
        <div class="step" data-t="s3"></div>
      </div>
      <div class="modes" role="radiogroup" data-ta="modes">
        <button class="mode sel" data-mode="basit" role="radio" aria-checked="true" data-t="m1"></button>
        <button class="mode" data-mode="detay" role="radio" aria-checked="false" data-t="m2"></button>
      </div>
      <button class="btn big pulse" id="startBtn" data-t="start"></button>

const LANG_KEY = 'ogm-lang';
function detectLang(){
  const q = new URLSearchParams(location.search).get('lang'); if(q==='en' || q==='tr') return q;
  try{ const s = localStorage.getItem(LANG_KEY); if(s==='en' || s==='tr') return s; }catch(e){}
  return /^tr\b/i.test(navigator.language || '') ? 'tr' : 'en';
}

const isEN = () => S.lang === 'en';
const tt = (tr, en) => isEN() ? en : tr;
const fmt = (x, d=1) => { const s = (x*100).toFixed(d).replace(/\.0+$/, ''); return isEN() ? s : s.replace('.', ','); };
const dec = (x, d=2) => { const s = x.toFixed(d); return isEN() ? s : s.replace('.', ','); };
const num = n => Math.round(n).toLocaleString(isEN() ? 'en-US' : 'tr-TR');
const pc = s => isEN() ? s + '%' : '%' + s;          /* yüzde işareti: TR "%85", EN "85%" */
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TAU = Math.PI*2, rnd = (a,b) => a + Math.random()*(b-a), pick = a => a[Math.floor(Math.random()*a.length)];
const clamp = (x,a,b) => Math.max(a, Math.min(b, x)), ease = u => u<.5 ? 2*u*u : 1-Math.pow(-2*u+2,2)/2;

/* Türkçe sayı ekleri: sfx(85,'poss') → "85'i", sfx(97,'poss') → "97'si", sfx(60,'abl') → "60'tan", sfx(86,'dat') → "86'ya" */
function sfx(n, kind){
  n = Math.round(n);
  const U = ['','bir','iki','üç','dört','beş','altı','yedi','sekiz','dokuz'], T = ['','on','yirmi','otuz','kırk','elli','altmış','yetmiş','seksen','doksan'];
  const w = n===0 ? 'sıfır' : n%10 ? U[n%10] : n%100 ? T[(n%100)/10] : n%1000 ? 'yüz' : 'bin';
  const lv = [...w].reverse().find(c => 'aeıioöuü'.includes(c)), endsV = 'aeıioöuü'.includes(w.slice(-1));
  const back = 'aıou'.includes(lv);
  let s;
  if(kind==='poss') s = (endsV?'s':'') + ({a:'ı',ı:'ı',e:'i',i:'i',o:'u',u:'u',ö:'ü',ü:'ü'})[lv];
  else if(kind==='abl') s = ('fsştçkph'.includes(w.slice(-1)) ? 't' : 'd') + (back?'an':'en');
  else s = (endsV?'y':'') + (back?'a':'e');
  return n + "'" + s;
}

/* --------- Ses --------- */
let AC = null;
function ac(){ AC = AC || new (window.AudioContext||window.webkitAudioContext)(); return AC; }
function beep(f, d=.12, type='sine', v=.07, when=0){
  if(!S.sound) return;
  try{
    const A = ac(), t = A.currentTime + when, o = A.createOscillator(), g = A.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t+d);
    o.connect(g).connect(A.destination); o.start(t); o.stop(t+d+.03);
  }catch(e){}
}
function noise(d=.6, v=.2, f=800, sweep=0, when=0){
  if(!S.sound) return;
  try{
    const A = ac(), n = Math.floor(A.sampleRate*d), b = A.createBuffer(1, n, A.sampleRate), ch = b.getChannelData(0);
    for(let i=0;i<n;i++) ch[i] = Math.random()*2-1;
    const src = A.createBufferSource(); src.buffer = b;
    const fl = A.createBiquadFilter(); fl.type = 'lowpass';
    const t = A.currentTime + when; fl.frequency.setValueAtTime(f, t); if(sweep) fl.frequency.exponentialRampToValueAtTime(sweep, t+d);
    const g = A.createGain(); g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.001, t+d);
    src.connect(fl).connect(g).connect(A.destination); src.start(t); src.stop(t+d);
  }catch(e){}
}

const sndWhoosh= () => noise(1.2,.07,250,4000);

/* --------- Olasılık yardımcıları --------- */
const shieldsBefore = (choices, k) => choices.slice(0,k).reduce((n,ci,j)=> n + (S.variants[j].options[ci].cost==='shield'?1:0), 0);
function effP(k, opt, usedShields){ return STAGES[k].cond ? Math.max(5, opt.p - PEN[Math.min(usedShields, PEN.length-1)]) : opt.p; }
function planFromChoices(choices){
  return choices.map((ci,k)=>{ const o = S.variants[k].options[ci]; return {k, ci, o, p: effP(k,o,shieldsBefore(choices,k))/100, pts:o.pts}; });
}
const prodP = plan => plan.reduce((a,s)=>a*s.p, 1);
function missionEV(plan){ let c=1, e=0; for(const s of plan){ c*=s.p; e+=s.pts*c; } return e; }

function allPlans(){
  const out = [];
  (function rec(k, sh, pt, ch){
    if(k===STAGES.length){ out.push(ch.slice()); return; }
    S.variants[k].options.forEach((o,i)=>{
      if(o.cost==='shield' && sh<1) return;
      if(o.cost==='part' && pt<1) return;
      ch.push(i);
      rec(k+1, sh-(o.cost==='shield'?1:0), pt-(o.cost==='part'?1:0), ch);
      ch.pop();
    });
  })(0, START_SHIELD, START_PART, []);
  return out.map(c=>{ const pl = planFromChoices(c); return {choices:c, plan:pl, P:prodP(pl), EV:missionEV(pl)}; });
}

function choose(i){
  if(S.busy || S.choices.length !== S.k) return;   // çift dokunmaya karşı
  const k = S.k, o = S.variants[k].options[i];

  if(o.cost==='shield'){ S.shield--; bump($('#chipShield')); W3.shield = true; beep(880,.25,'sine',.06); beep(1320,.3,'sine',.04,.08); }
  if(o.cost==='part'){ S.part--; bump($('#chipPart')); W3.sparkle(); beep(1200,.08,'square',.03); beep(1500,.08,'square',.03,.1); }
  W3.bags = /yastık/i.test(o.label);
  renderHUD();

    S.results[k] = 'hypo';
    if(k+1 >= STAGES.length){ S.k = k+1; renderTrack(); renderEnd(); } else goStage(k+1, true);
    return;
  }
  roll(k, o, p);
}

/* --------- Zar --------- */
function roll(k, o, p){
  S.busy = true;
  const r = Math.random(), n = Math.floor(r*100) + 1, ok = n <= p;   // n ≤ p  ⇔  r < p/100
  $('#stageBody').innerHTML = `<div class="panel rollpanel" style="margin-top:14px">
      <div class="kicker">${esc(oTx(o,'label'))}</div>
      <h3 id="rollTitle">🎲 ${tt('Zar atılıyor…','Rolling the dice…')}</h3>
      <div class="rollbar"><div class="g" style="width:${p}%">${p>=18?`<span class="lbl" style="left:12px">${tt('BAŞARI','SUCCESS')} 1–${p}</span>`:''}</div>
        <div class="marker" id="marker"><div class="num" id="markerNum">50</div><div class="stick"></div></div></div>
      <div class="scale"><span>1</span><span>${tt('Başarı','Success')}: 1–${p} · ${tt('Başarısızlık','Failure')}: ${p+1}–100</span><span>100</span></div>
      <div class="verdict" id="verdict"></div><div class="why" id="why"></div><div class="explain" id="explain"></div>
      <div class="actions" id="rollActions"></div></div>`;
  W3.tension = 1;
  const marker = $('#marker'), mnum = $('#markerNum'), target = (n-.5)/100;
  const D = 2200, t0 = performance.now(); let last = -1, lastTick = 0;
  (function frame(t){
    const u = Math.min(1, (t-t0)/D);
    let x = target + .55*Math.pow(1-u,2)*Math.sin(u*16 + target*7);
    x = clamp(x, .005, .995);
    const shown = u>=1 ? n : Math.floor(x*100)+1;
    marker.style.left = (u>=1 ? target : x)*100 + '%';
    mnum.textContent = shown;
    if(shown!==last && t-lastTick>55){ sndTick(); lastTick=t; } last = shown;
    if(u<1) requestAnimationFrame(frame); else { marker.classList.add('land'); rollDone(k, o, p, n, ok); }
  })(t0);
}

function rollDone(k, o, p, n, ok){
  S.results[k] = ok;
  W3.play(ok ? 'success' : 'fail');
  $('#rollTitle').textContent = `🎲 ${tt('Çıkan sayı','You rolled')}: ${n}`;
  const v = $('#verdict');
  v.textContent = ok ? tt('✅ BAŞARILI!','✅ SUCCESS!') : tt('❌ BAŞARISIZ','❌ FAILED');
  v.className = 'verdict ' + (ok?'ok':'bad');
  $('#why').textContent = oTx(o, ok ? 'ok' : 'fail');
  $('#explain').innerHTML = ok
    ? tt(`${n}, 1 ile ${p} arasında. Şansın %${p} idi. <b style="color:var(--star)">+${o.pts} bilim puanı</b>`,
         `${n} is between 1 and ${p}. Your chance was ${p}%. <b style="color:var(--star)">+${o.pts} science points</b>`)
    : tt(`${n}, ${sfx(p,'abl')} büyük. %${p} şansa rağmen olabilir: 100 komutandan yaklaşık ${sfx(100-p,'poss')} burada takılırdı.`,
         `${n} is greater than ${p}. Even with a ${p}% chance of success this can happen: about ${100-p} out of 100 commanders would fail here.`.replace(/ a (8\d|11|18)%/, ' an $1%'));
  if(ok){ sndOk(); S.points += o.pts; renderHUD(); bump($('#chipScore')); }
  else { sndBad(); S.failedAt = k; setTimeout(()=>{ const gm = $('#game'); gm.classList.remove('shake'); void gm.offsetWidth; gm.classList.add('shake'); }, k===STAGES.length-1 ? 900 : 480); }
  renderTrack();
  const last = k === STAGES.length-1;
  if(!ok && !last) $('#explain').innerHTML += tt(`<br><br><b>Görev burada sona erdi.</b> Ama matematiğin tamamını görmek için kalan ${STAGES.length-1-k} kararı da ver (zar atılmayacak).`,
                                                 `<br><br><b>The mission ends here.</b> But to see the full math, make your remaining ${STAGES.length-1-k} decision${STAGES.length-1-k>1?'s':''} too (no dice will be rolled).`);
  if(!ok || last) countGame(ok && last);
  setTimeout(() => {
    let a = '';
    if(ok) a = `<button class="btn okb" id="rollNext">${last ? tt('🎉 Sonuçları gör','🎉 See the results') : tt('Devam et →','Continue →')}</button>`;
    else if(!last) a = `<button class="btn warnb" id="rollHypo">${tt('🧪 Ya devam etseydin? Kalan kararları ver →','🧪 What if you had continued? Make your remaining decisions →')}</button>`;
    else a = `<button class="btn" id="rollNext">${tt('Sonuçları gör →','See the results →')}</button>`;
    $('#rollActions').innerHTML = a;
    S.busy = false;
    const nx = $('#rollNext'), hy = $('#rollHypo');
    if(nx) nx.onclick = () => { if(last) { S.k = STAGES.length; renderTrack(); renderEnd(); } else goStage(k+1); };
    if(hy) hy.onclick = () => { S.phase = 'hypo'; goStage(k+1, true); };
    (nx||hy).focus({preventScroll:true});
  }, ok ? (last ? 2300 : 1300) : 1500);
}

function countGame(win){
  if(S.counted) return; S.counted = true;
  const st = loadStats(); st.plays++; if(win) st.wins++; saveStats(st);
}

function countUp(el, to, fmtFn, dur=1400){
  const t0 = performance.now();
  (function f(t){ const u = Math.min(1,(t-t0)/dur), e = 1-Math.pow(1-u,3); el.textContent = fmtFn(to*e); if(u<1) requestAnimationFrame(f); })(t0);
}

/* --------- SONUÇ EKRANI --------- */
function renderEnd(){
  const det = S.mode==='detay';
  const plan = planFromChoices(S.choices);
  const P = prodP(plan), EV = missionEV(plan);
  const win = S.failedAt<0;
  const plans = allPlans();
  const safest = plans.reduce((a,b)=> b.P>a.P ? b : a);
  const richest = plans.reduce((a,b)=> b.EV>a.EV ? b : a);
  const per100 = Math.round(P*100);
  /* görev erken bittiyse, sonraki aşamaların kararları "Ya devam etseydin?" bölümünde zar atılmadan verilen hayali kararlardır */
  const isHypo = k => S.failedAt >= 0 && k > S.failedAt;
  const nHypo = S.failedAt >= 0 ? STAGES.length - 1 - S.failedAt : 0;
  const usedLand = shieldsBefore(S.choices, STAGES.length-1);
  const mark = k => isHypo(k) ? '🧪 ' : '👉 ';
  let luck;
  if(win && P<.35) luck = tt(`🍀 <b>Çok şanslıydın!</b> Bu kararlarla 100 komutandan sadece ${sfx(per100,'poss')} Mars'a ulaşır.`, `🍀 <b>You were very lucky!</b> With these decisions, only about ${per100} out of 100 commanders reach Mars.`);
  else if(win && P<.6) luck = tt(`🍀 <b>Biraz şans da yardım etti.</b> Bu kararlarla 100 komutandan yaklaşık ${sfx(per100,'poss')} başarır.`, `🍀 <b>A little luck helped too.</b> With these decisions, about ${per100} out of 100 commanders succeed.`);
  else if(win) luck = tt(`🧠 <b>Akıllı kararlar!</b> Planın güvenliydi: 100 komutandan yaklaşık ${sfx(per100,'poss')} başarır.`, `🧠 <b>Smart decisions!</b> Your plan was safe: about ${per100} out of 100 commanders succeed.`);
  else if(P>=.6) luck = tt(`🎲 <b>Şanssızlık!</b> Kararların iyiydi: 100 komutandan yaklaşık ${sfx(per100,'poss')} başarırdı. Ama zar bazen böyle gelir.`, `🎲 <b>Bad luck!</b> Your decisions were good: about ${per100} out of 100 commanders would succeed. But sometimes the dice just don't cooperate.`);
  else luck = tt(`🎲 Planın riskliydi: 100 komutandan yaklaşık ${sfx(per100,'poss')} başarırdı. Başarısız olmak hiç de şaşırtıcı değildi!`, `🎲 Your plan was risky: only about ${per100} out of 100 commanders would succeed. Failing was not surprising at all!`);

  /* hero */
  let h = `<div class="hud"><div class="title">${tt('Uzay Görevi: Olasılık Macerası','Space Mission: A Probability Adventure')}</div>
      <div class="row">${langSwitchHTML()}<div class="modeswitch" role="group" aria-label="${tt('Anlatım seviyesi','Explanation level')}">
        <button data-m="basit" class="${!det?'sel':''}">${tt('🧒 Kaşif','🧒 Explorer')}</button><button data-m="detay" class="${det?'sel':''}">${tt('🧑‍🔬 Bilim insanı','🧑‍🔬 Scientist')}</button></div>
        <button class="iconbtn" id="homeBtn2" aria-label="${tt('Başa dön','Back to start')}">🏠</button></div></div>
    <div class="panel hero" style="padding-top:0">
      <div id="endHost" class="host3d" aria-hidden="true"></div>
      <div class="inner">
      <h1>${win ? tt('🎉 Mars\'a ulaştın, Komutan!','🎉 You made it to Mars, Commander!') : tt(`💥 Görev ${S.failedAt+1}. aşamada sona erdi`, `💥 The mission ended at stage ${S.failedAt+1}`)}</h1>
      <div class="muted">${win ? `${tt('Topladığın bilim puanı','Science points collected')}: <b style="color:var(--star)">⭐ ${num(S.points)}</b>`
                              : `${tt(`${esc(stN(S.failedAt))} aşamasında şans yüzüne gülmedi.`, `Luck was not on your side during the ${esc(stN(S.failedAt))} stage.`)} ${tt('Toplanan puan','Points collected')}: <b style="color:var(--star)">⭐ ${num(S.points)}</b>`}</div>
      <div style="margin-top:18px" class="muted">${nHypo ? tt('Tamamladığın planla görevin başarı şansı','Chance of success for your completed plan') : tt('Senin kararlarınla görevin başarı şansı','Chance of success with your decisions')}</div>
      <div class="bigp" id="bigP">${pc(0)}</div>
      <div class="luck">${luck}</div>
      </div>
    </div>`;
  if(nHypo) h += `<div class="panel sec hyponote" style="margin-top:16px">${tt(
      `🧪 <b>Görev ${S.failedAt+1}. aşamada bitti</b>, ama sonraki ${nHypo} aşamanın kararlarını “Ya devam etseydin?” bölümünde <b>zar atılmadan</b> sen verdin.
      Aşağıdaki bütün hesaplar, gerçek kararlarınla bu hayali kararlarının birleştiği <b>tam plan</b> üzerinden yapılıyor.

      `🧪 <b>The mission ended at stage ${S.failedAt+1}</b>, but you made the decisions for the remaining ${nHypo} stage${nHypo>1?'s':''} in the “What if you had continued?” section, <b>without rolling the dice</b>.
      All the calculations below use your <b>complete plan</b>: your real decisions combined with these hypothetical ones.
      In the tables, 👉 marks your real decisions and 🧪 marks the hypothetical decisions you made after the mission ended.`)}</div>`;

  /* 1 · Çarpım kuralı */
  let chain = '', cum = '', c = 1, di = 0;
  plan.forEach((s,i)=>{
    const lastK = i === STAGES.length-1, condLbl = lastK && usedLand ? ` · 🛡️×${usedLand}` : '';
    chain += `${i?`<span class="op" style="animation-delay:${(di++)*.12}s">×</span>`:''}<span class="c${isHypo(i)?' hypo':''}" style="animation-delay:${(di++)*.12}s">${pc(Math.round(s.p*100))}<small>${isHypo(i)?'🧪 ':''}${stS(i)}${condLbl}</small></span>`;
    c *= s.p;
    cum += `<div class="r"><span>${STAGES[i].icon} ${tt(`${stS(i)} sonrası`, `After ${stS(i).toLowerCase()}`)}${isHypo(i)?' 🧪':''}</span><div class="bar"><i style="width:0" data-w="${c*100}"></i></div><span class="v">${pc(fmt(c))}</span></div>`;
  });
  chain += `<span class="op" style="animation-delay:${(di++)*.12}s">=</span><span class="c res" style="animation-delay:${(di++)*.12}s">${pc(fmt(P))}<small>${tt('Görev','Mission')}</small></span>`;
  const p0 = plan[0].p, p1 = plan[1].p, pL = plan[STAGES.length-1];
  const factor = (s,i) => i === STAGES.length-1 ? tt(`P(İniş | kalkan ${usedLand} kez)=${dec(s.p)}`, `P(Landing | shield used ${usedLand}×)=${dec(s.p)}`) : dec(s.p);
  h += `<div class="panel sec"><h2><span class="n">1</span>${tt('Şanslar neden çarpılır?','Why do the chances multiply?')}</h2>

      ? tt(`Görevin başarılı olması için <b>bütün</b> aşamaların başarılı olması gerekir. Böyle “hepsi birden” olaylarda olasılıklar <b>çarpılır</b>: <b>P(A ve B) = P(A) · P(B | A)</b>.
         İlk dört aşamanın şansı önceki aşamalardan etkilenmez; onlarda P(B | A) = P(B) olduğu için şanslar olduğu gibi çarpılır (<b>bağımsız olaylar</b>).
         İnişin şansı ise kalkanı kaç kez kullandığına <b>bağlıdır</b>; bu yüzden çarpıma inişin <b>koşullu</b> şansı girer (3. bölüm).`,
           `The mission succeeds only if <b>every</b> stage succeeds. For “all of them together” events, probabilities <b>multiply</b>: <b>P(A and B) = P(A) · P(B | A)</b>.
         The chances of the first four stages are not affected by earlier stages, so for them P(B | A) = P(B) and the chances multiply as they are (<b>independent events</b>).
         The landing chance, however, <b>depends</b> on how many times you used the shield, so the <b>conditional</b> landing chance goes into the product (section 3).`)
      : tt(`Mars'a varmak için <b>bütün</b> aşamaları geçmen gerekiyor. Her aşama, elindeki şansın bir kısmını alıp götürür. Bu yüzden şanslar <b>çarpılır</b> ve her adımda biraz daha küçülür.
         <br>🛡️ ${usedLand ? `Kalkanı ${usedLand} kez kullandığın için önce iniş şansını buna göre güncelledik (%${pL.o.p} → %${Math.round(pL.p*100)}), sonra bütün aşamaların şanslarını çarptık.` : `Kalkan kullansaydın, önce iniş şansını buna göre güncelleyip sonra şansları çarpacaktık. Sen kalkanı saklayarak inişte tam şansını korudun.`}`,
           `To reach Mars, you have to pass <b>every</b> stage. Each stage takes away part of the chance you have left. That is why the chances <b>multiply</b> and get a little smaller at every step.
         <br>🛡️ ${usedLand ? `Because you used the shield ${usedLand} time${usedLand>1?'s':''}, we first updated your landing chance (${pL.o.p}% → ${Math.round(pL.p*100)}%), then multiplied the chances of all the stages.` : `If you had used the shield, we would first update your landing chance and then multiply. By saving the shield, you kept your full landing chance.`}`)}</p>
    <div class="chain">${chain}</div>
    ${det ? `<div class="formula">${tt('P(görev)','P(mission)')} = ${plan.map(factor).join(' · ')} = ${dec(P,3)}</div>`
          : `<p class="muted">${tt(`Örnek: 100 komutan yola çıksın. İlk aşamayı yaklaşık <b>${sfx(Math.round(p0*100),'poss')}</b> geçer. Onların da %${sfx(Math.round(p1*100),'poss')} ikinci aşamayı geçer: geriye yaklaşık <b>${Math.round(p0*p1*100)}</b> komutan kalır. Böyle devam eder…`,
                                   `Example: 100 commanders set off. About <b>${Math.round(p0*100)}</b> of them pass the first stage. ${Math.round(p1*100)}% of those pass the second stage, so about <b>${Math.round(p0*p1*100)}</b> commanders are left. And so on…`)}</p>`}
    <div class="cum"><div class="r"><span>🌍 ${tt('Başlangıç','Start')}</span><div class="bar"><i style="width:0" data-w="100"></i></div><span class="v">${pc(100)}</span></div>${cum}</div>
  </div>`;

  /* 2 · Beklenen değer */
  let rows = '';
  plan.forEach((s,k)=>{
    const used = shieldsBefore(S.choices, k), v = S.variants[k];
    const opts = v.options.map((o,i)=>({o, i, p:effP(k,o,used)/100})).map(x=>({...x, ev:x.p*x.o.pts}));
    const maxEV = Math.max(...opts.map(x=>x.ev));
    rows += `<tr class="stg"><td colspan="4">${STAGES[k].icon} ${k+1}. ${esc(vT(v))}${isHypo(k)?` <span class="muted small">(🧪 ${tt('hayali karar','hypothetical decision')})</span>`:''}</td></tr>`;
    opts.forEach(x=>{
      rows += `<tr class="${x.i===s.ci?'mine':''}"><td>${x.i===s.ci?mark(k):''}${esc(oTx(x.o,'label'))}${x.o.cost==='shield'?' 🛡️':x.o.cost==='part'?' 🔧':''}</td>
        <td class="num">${pc(Math.round(x.p*100))}</td><td class="num">${x.o.pts}</td>

  });
  const planSteps = ch => ch.map((ci,k)=>{ const o = S.variants[k].options[ci]; return esc(oTx(o,'label')) + (o.cost==='shield'?' 🛡️':o.cost==='part'?' 🔧':''); }).join(' → ');
  const planCard = (title, pl, me) => `<div class="plan ${me?'me':''}"><span class="muted small">${title}</span><b>${pc(fmt(pl.P))}</b><span class="small">${tt(`başarı şansı · görev başına beklenen toplam <b>${dec(pl.EV,0)}</b> puan`, `chance of success · expected total of <b>${dec(pl.EV,0)}</b> points per mission`)}</span>${pl.choices ? `<div class="small muted" style="margin-top:6px">${planSteps(pl.choices)}</div>` : ''}</div>`;

  h += `<div class="panel sec"><h2><span class="n">2</span>${tt('Beklenen değer: Risk almaya değer mi?','Expected value: Is the risk worth it?')}</h2>

           `The <b>expected value</b> of an option is the average number of points we would earn per choice if we repeated it many times: <b>E = p × points + (1 − p) × 0</b>. The values in the table <b>assume you reach that stage</b>.`)
      : tt(`<b>Beklenen değer = şans × ödül.</b> Bir seçeneği 100 kez seçseydin, her seferinde <b>ortalama</b> kaç puan kazanırdın? Örneğin %70 şansla 140 puan: ortalama 0,7 × 140 = 98 puan. Tablodaki puanlar, <b>o aşamaya ulaştığını varsayar</b>.`,
           `<b>Expected value = chance × reward.</b> If you picked an option 100 times, how many points would you earn <b>on average</b> each time? For example, 140 points with a 70% chance: on average 0.7 × 140 = 98 points. The points in the table <b>assume you reach that stage</b>.`)}</p>
    <div class="tablewrap"><table><thead><tr><th>${tt('Seçenek','Option')}</th><th class="num">${tt('Şans','Chance')}</th><th class="num">${tt('Puan','Points')}</th><th class="num">${tt('Bu aşamaya ulaşırsan beklenen puan','Expected points if you reach this stage')}</th></tr></thead><tbody>${rows}</tbody></table></div>
    <p class="small muted">${nHypo ? tt('👉 gerçek kararın · 🧪 hayali kararın','👉 your real decision · 🧪 your hypothetical decision') : tt('👉 senin kararın','👉 your decision')} · ${tt(
      `★ <b>yalnızca o aşamanın</b> şansı ve ödülüne bakıldığında en yüksek beklenen değer. Kalkanın inişi zayıflatması gibi <b>sonraki aşamalara etkisi dahil değildir</b>; bu yüzden ★'ları toplamak her zaman en iyi planı vermez.`,
      `★ the highest expected value when looking at <b>that stage's</b> chance and reward <b>only</b>. Effects on later stages, such as the shield weakening the landing, <b>are not included</b>, so adding up the ★s does not always give the best plan.`)}</p>
    <h3 style="margin:16px 0 6px;font-size:1.08rem">${tt('Bütün görevin beklenen puanı','Expected points for the whole mission')}</h3>
    <p class="lead" style="margin-top:0">${det
      ? tt(`Başarısız olunca o ana kadar kazanılan puanlar korunur, sonrakiler gelmez. Bu yüzden her aşamanın puanı, <b>o aşamaya kadar hepsini geçme olasılığıyla</b> çarpılıp toplanır:`,
           `When a stage fails, the points earned so far are kept and later ones are not earned. So each stage's points are multiplied by <b>the probability of passing every stage up to and including it</b>, and then added up:`)
      : tt(`Başarısız olursan o ana kadar kazandığın puanlar sende kalır, sonrakileri kazanamazsın. Bu yüzden her aşamanın puanını, <b>o aşamaya kadar hepsini geçme şansınla</b> çarpıp topluyoruz:`,
           `If you fail, you keep the points you have earned so far, but you cannot earn the later ones. So we multiply each stage's points by <b>your chance of passing every stage up to that one</b>, and add them up:`)}</p>
    <div class="formula">${det ? tt('E[toplam] = p₁·r₁ + p₁p₂·r₂ + … + p₁p₂p₃p₄p₅·r₅ = ','E[total] = p₁·r₁ + p₁p₂·r₂ + … + p₁p₂p₃p₄p₅·r₅ = ') : tt('Beklenen toplam = ','Expected total = ')}${plan.map((s,i)=>`${s.pts}×${dec(cumP(i),3)}`).join(' + ')} ≈ <b>${dec(EV,1)}</b> ${tt('puan','points')}</div>
    <div class="plans">${planCard(tt('Senin planın','Your plan'), {P, EV}, true)}${planCard(tt('En güvenli plan','Safest plan'), safest)}${planCard(tt('En yüksek beklenen puanlı plan','Highest expected-score plan'), richest)}</div>
    <p class="small muted" style="margin-top:8px">${tt(
      `Bu iki plan, karşına çıkan senaryolardaki <b>${num(plans.length)} olası planın hepsi tek tek denenerek</b> bulundu. Hesapta kalkan (en çok ${START_SHIELD}) ve yedek parça (en çok ${START_PART}) sınırları ile kalkanın iniş şansını düşürmesi dikkate alındı.`,
      `These two plans were found by <b>checking all ${num(plans.length)} possible plans</b> for the scenarios you faced, one by one. The calculation respects the shield (at most ${START_SHIELD}) and spare part (at most ${START_PART}) limits, and the way the shield lowers the landing chance.`)}</p>
    <div class="callout">💡 ${det
      ? tt(`Tek bir aşamaya bakınca riskli seçeneğin beklenen değeri yüksek görünebilir. Ama burada başarısızlık <b>tüm görevi</b> bitiriyor ve sonraki aşamaların puanlarını da kaybettiriyor. Bu yüzden iyi bir komutan, beklenen değeri <b>tüm görev</b> için hesaplar ve riski de dikkate alır.`,
           `Looking at a single stage, a risky option can seem to have a high expected value. But here a failure ends <b>the whole mission</b> and also costs you the points of every later stage. That is why a good commander calculates expected value for <b>the whole mission</b> and takes risk into account too.`)
      : tt(`Bazen riskli seçenek ortalamada daha çok puan getirir. Ama dikkat! Burada bir aşamada başarısız olursan <b>bütün görev</b> biter. Akıllı komutan hem ödüle hem de riske bakar.`,
           `Sometimes the risky option earns more points on average. But careful! Here, failing one stage ends <b>the whole mission</b>. A smart commander looks at both the reward and the risk.`)}</div>
  </div>`;

  /* 3 · Koşullu olasılık */
  const usedL = shieldsBefore(S.choices, 4), landO = plan[4].o;
  let crow = '';
  for(let u=0; u<=START_SHIELD; u++){
    const pu = Math.max(5, landO.p - PEN[u]);
    crow += `<tr class="${u===usedL?'mine':''}"><td>${u===usedL?'👉 ':''}${u===0?tt('Hiç kullanılmadı','Never used'):tt(`${u} kez kullanıldı`, `Used ${u} time${u>1?'s':''}`)}</td><td class="num">${pc(pu)}</td>

/* --------- 1000 görev simülasyonu --------- */
function simulate(plan, N){
  const wins = new Uint16Array(N+1), failAt = new Array(plan.length).fill(0); let w = 0, pts = 0;
  for(let i=1;i<=N;i++){
    let ok = true;
    for(let k=0;k<plan.length;k++){
      if(Math.random() < plan[k].p){ pts += plan[k].pts; }
      else { failAt[k]++; ok = false; break; }
    }
    if(ok) w++;
    wins[i] = w;
  }
  return {wins, failAt, w, avgPts: pts/N};
}

let simAnim = 0;
function runSim(plan, P){
  const N = 1000, R = simulate(plan, N), D = 4200, t0 = performance.now();
  const btn = $('#simBtn'); btn.disabled = true; btn.classList.remove('pulse'); btn.textContent = tt('⏳ Oynatılıyor…','⏳ Flying…');
  $('#simText').innerHTML = '';
  cancelAnimationFrame(simAnim);
  let lastShown = 0;
  const frame = t => {
    if(!$('#simBtn')) return;
    const u = Math.min(1, (t-t0)/D);
    const n = Math.max(1, Math.min(N, Math.round(Math.pow(N, u))));
    $('#cN').textContent = num(n);
    $('#cW').textContent = num(R.wins[n]);
    $('#cR').textContent = pc(fmt(R.wins[n]/n));
    drawChart(R.wins, n, P);
    if(n!==lastShown && n<60) sndTick(); lastShown = n;
    if(u<1) simAnim = requestAnimationFrame(frame);
    else simDone(R, plan, P);
  };
  simAnim = requestAnimationFrame(frame);
}

function simDone(R, plan, P){
  const N = 1000, obs = R.w/N, det = S.mode==='detay';
  const btn = $('#simBtn'); btn.disabled = false; btn.textContent = tt('🔁 Tekrar oynat','🔁 Run again');
  renderFails(R.failAt, plan);
  const r10 = R.wins[10]/10, r100 = R.wins[100]/100, diff = Math.abs(obs-P);
  const sd = n => Math.sqrt(P*(1-P)/n);
  $('#simText').innerHTML = `<div class="callout" style="margin-top:14px">
    <p>${tt(`🎯 1000 görevin <b>${num(R.w)}</b> tanesi Mars'a ulaştı: <b>%${fmt(obs)}</b>. Hesapladığımız şans <b>%${fmt(P)}</b> idi. Fark sadece <b>${fmt(diff)}</b> puan!`,
            `🎯 <b>${num(R.w)}</b> of the 1,000 missions reached Mars: <b>${fmt(obs)}%</b>. Our calculated chance was <b>${fmt(P)}%</b>. A difference of only <b>${fmt(diff)}</b> percentage points!`)}</p>
    <p>${tt(`İlk 10 görevde oran <b>%${fmt(r10)}</b>, ilk 100 görevde <b>%${fmt(r100)}</b>, 1000 görevde <b>%${fmt(obs)}</b> oldu.`,
            `The rate was <b>${fmt(r10)}%</b> after the first 10 missions, <b>${fmt(r100)}%</b> after 100, and <b>${fmt(obs)}%</b> after 1,000.`)} ${det
      ? tt(`Bu <b>Büyük Sayılar Yasası</b>'dır: deneme sayısı n arttıkça gözlenen oran teorik olasılığa yaklaşır. Tipik sapma yaklaşık √(p(1−p)/n): n = 10 için ±%${fmt(sd(10))}, n = 100 için ±%${fmt(sd(100))}, n = 1000 için ±%${fmt(sd(1000))}.`,
           `This is the <b>Law of Large Numbers</b>: as the number of trials n grows, the observed rate approaches the theoretical probability. The typical deviation is about √(p(1−p)/n): ±${fmt(sd(10))}% for n = 10, ±${fmt(sd(100))}% for n = 100, and ±${fmt(sd(1000))}% for n = 1,000.`)
      : tt(`Az sayıda denemede sonuç zıplayıp duruyor. Ama deneme sayısı arttıkça çizgi sarı çizgiye, yani gerçek olasılığa yaklaşıyor. Buna <b>Büyük Sayılar Yasası</b> denir.`,
           `With only a few tries, the result jumps around. But as the number of tries grows, the line gets closer to the yellow line, the true probability. This is called the <b>Law of Large Numbers</b>.`)}</p>
    <p>${tt(`⭐ Bir görevin ortalama puanı: simülasyonda <b>${dec(R.avgPts,1)}</b>, beklenen değer hesabında <b>${dec(missionEV(plan),1)}</b>.`,
            `⭐ Average points per mission: <b>${dec(R.avgPts,1)}</b> in the simulation, <b>${dec(missionEV(plan),1)}</b> from the expected value calculation.`)}${det?tt(' Beklenen değer de büyük sayılar yasasıyla ortalamaya yaklaşır.',' The average also approaches the expected value, thanks to the law of large numbers.'):tt(' Yine çok yakın!',' Very close again!')}</p>
    <p class="small muted">${tt('"Tekrar oynat"a basarsan sonuç her seferinde biraz değişir ama hep teorik değerin yakınında kalır.','If you press "Run again", the result changes a little each time, but it always stays close to the theoretical value.')}</p></div>`;
}

function renderFails(failAt, plan){
  const N = 1000; let reach = 1, h = '';
  plan.forEach((s,k)=>{
    const theo = N*reach*(1-s.p); reach *= s.p;
    const obs = failAt ? failAt[k] : null, max = N*.6;
    h += `<div class="r"><span>${STAGES[k].icon} ${stS(k)}</span>
      <div class="bar"><i style="width:${obs==null?0:Math.min(100,obs/max*100)}%"></i><u style="left:${Math.min(100,theo/max*100)}%" title="${tt('Beklenen','Expected')}"></u></div>
      <span class="small">${obs==null?'–':num(obs)} <span class="muted">/ ~${num(theo)}</span></span></div>`;
  });
  $('#fails').innerHTML = h + `<p class="small muted" style="margin:4px 0 0">${tt(
    'Kırmızı çubuk: simülasyonda o aşamada takılan görev sayısı · Beyaz çizgi ve "~" sayı: hesapla beklenen sayı. En uzun çubuk, planının en zayıf halkası!',
    'Red bar: number of simulated missions that failed at that stage · White line and "~" number: the expected count from the calculation. The longest bar is the weakest link in your plan!')}</p>`;
}

function drawChart(wins, n, P){
  const cv = $('#chart'); if(!cv) return;
  S.lastChart = [wins, n, P];
  const dpr = window.devicePixelRatio||1, W = cv.clientWidth, H = cv.clientHeight;
  if(cv.width !== Math.round(W*dpr) || cv.height !== Math.round(H*dpr)){ cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr); }
  const g = cv.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,W,H);
  const L = 46, Rm = 14, T = 12, B = 30, w = W-L-Rm, hh = H-T-B, N = 1000;
  const X = i => L + Math.log10(i)/Math.log10(N)*w, Y = r => T + (1-r)*hh;
  g.font = '12px system-ui, sans-serif'; g.fillStyle = '#a9b3da'; g.strokeStyle = 'rgba(150,170,255,.15)'; g.lineWidth = 1;
  for(const r of [0,.25,.5,.75,1]){ g.beginPath(); g.moveTo(L,Y(r)); g.lineTo(L+w,Y(r)); g.stroke(); g.textAlign='right'; g.fillText(pc(r*100), L-8, Y(r)+4); }
  g.textAlign='center';
  for(const i of [1,10,100,1000]){ g.beginPath(); g.moveTo(X(i),T); g.lineTo(X(i),T+hh); g.stroke(); g.fillText(num(i), X(i), H-10); }
  g.setLineDash([7,6]); g.strokeStyle = '#ffd166'; g.lineWidth = 2.5;
  g.beginPath(); g.moveTo(L,Y(P)); g.lineTo(L+w,Y(P)); g.stroke(); g.setLineDash([]);
  if(!n) { g.fillStyle='#a9b3da'; g.textAlign='center'; g.fillText(tt('▶ düğmesine bas ve izle','Press ▶ and watch'), L+w/2, T+hh/2 + (P>.5?40:-30)); return; }
  const grd = g.createLinearGradient(0,T,0,T+hh); grd.addColorStop(0,'rgba(159,208,255,.25)'); grd.addColorStop(1,'rgba(159,208,255,0)');
  g.beginPath(); g.moveTo(X(1), T+hh); for(let i=1;i<=n;i++) g.lineTo(X(i), Y(wins[i]/i)); g.lineTo(X(n), T+hh); g.closePath(); g.fillStyle = grd; g.fill();
  g.strokeStyle = '#9fd0ff'; g.lineWidth = 2.5; g.lineJoin = 'round'; g.shadowColor = 'rgba(159,208,255,.8)'; g.shadowBlur = 8; g.beginPath();
  for(let i=1;i<=n;i++){ const x = X(i), y = Y(wins[i]/i); i===1 ? g.moveTo(x,y) : g.lineTo(x,y); }
  g.stroke(); g.shadowBlur = 0;
  const ex = X(n), ey = Y(wins[n]/n);
  g.fillStyle = '#fff'; g.beginPath(); g.arc(ex,ey,5,0,Math.PI*2); g.fill();
}

    st = Array.from({length: Math.round(W*H/5000)}, ()=>({x:Math.random()*W, y:Math.random()*H, r:Math.random()*1.4+.2, a:Math.random()*6, s:Math.random()*.02+.004, v:Math.random()*.08+.01})); }

    const dt = last ? Math.min(.05,(now-last)/1000) : .016; last = now;
    const grd = g.createRadialGradient(W*.8, H*.1, 0, W*.8, H*.1, Math.max(W,H));
    grd.addColorStop(0,'#1d1648'); grd.addColorStop(.5,'#0a1030'); grd.addColorStop(1,'#050816');
    g.fillStyle = grd; g.fillRect(0,0,W,H);
    const n2 = g.createRadialGradient(W*.1, H*.85, 0, W*.1, H*.85, Math.max(W,H)*.6); n2.addColorStop(0,'rgba(255,90,160,.08)'); n2.addColorStop(1,'rgba(255,90,160,0)'); g.fillStyle = n2; g.fillRect(0,0,W,H);
    for(const s of st){ s.a += s.s; s.x -= s.v; if(s.x<0) s.x = W;
      g.globalAlpha = .45 + .55*Math.abs(Math.sin(s.a)); g.fillStyle = '#fff'; g.beginPath(); g.arc(s.x,s.y,s.r,0,Math.PI*2); g.fill(); }
    g.globalAlpha = 1;
    nextShoot -= dt;
    if(nextShoot <= 0 && !shoot){ shoot = {x:rnd(.2,1)*W, y:rnd(0,.4)*H, vx:-rnd(500,800), vy:rnd(150,300), life:1}; nextShoot = rnd(4,9); }
    if(shoot){ shoot.x += shoot.vx*dt; shoot.y += shoot.vy*dt; shoot.life -= dt*1.2;
      const gr = g.createLinearGradient(shoot.x, shoot.y, shoot.x - shoot.vx*.15, shoot.y - shoot.vy*.15); gr.addColorStop(0,`rgba(255,255,255,${shoot.life})`); gr.addColorStop(1,'rgba(255,255,255,0)');
      g.strokeStyle = gr; g.lineWidth = 2; g.beginPath(); g.moveTo(shoot.x, shoot.y); g.lineTo(shoot.x - shoot.vx*.15, shoot.y - shoot.vy*.15); g.stroke();
      if(shoot.life <= 0) shoot = null; }
    requestAnimationFrame(draw);
  }
  addEventListener('resize', size);
  size(); requestAnimationFrame(draw);
})();

applyStatic();
W3.attach($('#introHost')); W3.set('intro');
renderStandStats();
</script>
